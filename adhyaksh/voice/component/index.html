<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --text: CanvasText; --surface: Canvas; --border: GrayText; --muted: GrayText; --accent: Highlight; --on-accent: HighlightText; }
  body { margin: 0; font-family: system-ui, "Segoe UI", "Noto Sans Devanagari", "Noto Sans Gujarati", sans-serif; font-size: 14px; color: var(--text); background: transparent; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 2px; }
  select, button { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px 12px; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  #status { color: var(--muted); }
</style>
</head>
<body>
<div class="row">
  <label for="lang">Voice language</label>
  <select id="lang">
    <option value="en-IN">English</option>
    <option value="hi-IN">Hindi</option>
    <option value="gu-IN">Gujarati</option>
  </select>
  <button id="mic" type="button" class="primary">Start listening</button>
  <span id="status" role="status" aria-live="polite">Ready</span>
</div>
<script>
  const root = document.documentElement;
  const statusEl = document.getElementById("status");
  const micBtn = document.getElementById("mic");
  const langSel = document.getElementById("lang");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, lastSpoken = "", langInit = false;

  function post(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*"); }
  function fit() { post("streamlit:setFrameHeight", { height: document.body.scrollHeight + 6 }); }
  function setStatus(t) { statusEl.textContent = t; fit(); }
  function emit(v) { post("streamlit:setComponentValue", { value: v, dataType: "json" }); }

  const ERRORS = {
    "not-allowed": "Microphone permission was denied. Allow it in the browser address bar.",
    "service-not-allowed": "Speech recognition is blocked in this browser.",
    "no-speech": "No speech was detected. Try again.",
    "audio-capture": "No microphone was found.",
    "network": "Speech recognition needs an internet connection in this browser.",
    "language-not-supported": "This language is not supported by the browser speech service."
  };

  if (!SR) {
    micBtn.disabled = true;
    setStatus("Voice input is not supported in this browser. Use Chrome or Edge, or type your message.");
  } else {
    rec = new SR();
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onstart = function () { listening = true; micBtn.textContent = "Stop listening"; setStatus("Listening"); };
    rec.onend = function () { listening = false; micBtn.textContent = "Start listening"; if (statusEl.textContent === "Listening") setStatus("Ready"); };
    rec.onerror = function (e) { setStatus(ERRORS[e.error] || ("Voice error: " + e.error)); };
    rec.onresult = function (e) {
      const text = e.results[0][0].transcript.trim();
      if (text) { setStatus("Heard: " + text); emit({ text: text, lang: langSel.value, nonce: String(Date.now()) }); }
    };
    micBtn.addEventListener("click", function () {
      if (listening) { rec.stop(); return; }
      rec.lang = langSel.value;
      try { rec.start(); } catch (err) { setStatus("Could not start listening. Try again."); }
    });
  }

  function speak(text) {
    if (!("speechSynthesis" in window)) { setStatus("Spoken replies are not supported in this browser."); return; }
    const code = langSel.value;
    const voices = window.speechSynthesis.getVoices();
    if (voices.length && !voices.some(function (v) { return v.lang.toLowerCase().indexOf(code.slice(0, 2)) === 0; })) {
      setStatus("No installed voice for this language on this system.");
    }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = code;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }

  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "streamlit:render") return;
    const a = event.data.args || {};
    const t = a.tokens || {};
    Object.keys(t).forEach(function (k) { root.style.setProperty("--" + k.replace(/_/g, "-"), t[k]); });
    if (!langInit && a.lang) { langSel.value = a.lang; langInit = true; }
    if (a.speak_nonce && a.speak_nonce !== lastSpoken && a.speak_text) { lastSpoken = a.speak_nonce; speak(a.speak_text); }
    fit();
  });
  post("streamlit:componentReady", { apiVersion: 1 });
  fit();
</script>
</body>
</html>
